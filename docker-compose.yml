version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: onlyjobs_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: onlyjobs_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      
  pgadmin:
    image: dpage/pgadmin4
    container_name: onlyjobs_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kiet.edu
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  pgdata:
    driver: local
  pgadmin_data:
    driver: local
